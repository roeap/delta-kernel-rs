[package]
edition = "2021"
rust-version = "1.88"
name = "buoyant_kernel"
version = "0.28.1"
build = "build.rs"
exclude = [
    "tests/golden_tables.rs",
    "tests/golden_data/",
    "tests/data/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Buoyant Data distribution of delta-kernel"
homepage = "https://delta.io"
documentation = "https://docs.rs/buoyant_kernel"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/delta-io/delta-kernel-rs"
resolver = "3"

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
pre-release-hook = [
    "git",
    "cliff",
    "--repository",
    "../",
    "--config",
    "../cliff.toml",
    "--unreleased",
    "--prepend",
    "../CHANGELOG.md",
    "--include-path",
    "*",
    "--tag",
    "{{version}}",
]

[[package.metadata.release.pre-release-replacements]]
file = "../README.md"
search = 'delta_kernel = "[a-z0-9\.-]+"'
replace = 'delta_kernel = "{{version}}"'

[[package.metadata.release.pre-release-replacements]]
file = "../README.md"
search = 'version = "[a-z0-9\.-]+"'
replace = 'version = "{{version}}"'

[features]
adaptive-metadata-in-dev = []
arrow = ["arrow-59"]
arrow-58 = [
    "dep:arrow_58",
    "dep:parquet_58",
    "dep:object_store_13",
]
arrow-59 = [
    "dep:arrow_59",
    "dep:parquet_59",
    "dep:object_store_13",
]
arrow-conversion = ["need-arrow"]
arrow-expression = ["need-arrow"]
check-constraints-in-dev = []
declarative-plans = [
    "internal-api",
    "dep:prost",
    "dep:prost-build",
]
default = []
default-engine-base = [
    "arrow-conversion",
    "arrow-expression",
    "need-arrow",
    "reqwest",
]
geo-type-in-dev = []
integration-test = ["hdfs-native-object-store/integration-test"]
internal-api = []
nanosecond-timestamps = []
need-arrow = []
prettyprint = [
    "arrow_58?/prettyprint",
    "arrow_59?/prettyprint",
]
schema-diff = []
test-utils = ["prettyprint"]
vendored-protoc = ["dep:protoc-bin-vendored"]

[lib]
name = "buoyant_kernel"
path = "src/lib.rs"

[[example]]
name = "metrics-tester"
path = "tests/integration/metrics_main.rs"

[[test]]
name = "commit_range"
path = "tests/commit_range.rs"

[[test]]
name = "incremental_scan"
path = "tests/incremental_scan.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[bench]]
name = "expression_bench"
path = "benches/expression_bench.rs"
harness = false

[[bench]]
name = "metadata_bench"
path = "benches/metadata_bench.rs"
harness = false

